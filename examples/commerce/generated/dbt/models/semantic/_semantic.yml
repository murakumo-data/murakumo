version: 2
models:
- name: metricflow_time_spine
  description: 'One row per day, 2000 to 2040: MetricFlow''s time spine.'
  time_spine:
    standard_granularity_column: date_day
  columns:
  - name: date_day
    granularity: day
semantic_models:
- name: dim_customer
  description: Customers, with every change to their segment, balance or country kept as a new version.
  model: ref('dim_customer')
  dimensions:
  - name: valid_from
    type: time
    type_params:
      time_granularity: day
      validity_params:
        is_start: true
  - name: valid_to
    type: time
    type_params:
      time_granularity: day
      validity_params:
        is_end: true
  - name: market_segment
    type: categorical
  entities:
  - name: dim_customer
    type: natural
    expr: customer_id
  primary_entity: dim_customer_version
- name: dim_part
  description: Parts we sell.
  model: ref('dim_part')
  dimensions:
  - name: brand
    type: categorical
  entities:
  - name: dim_part
    type: primary
    expr: part_id
- name: fct_order_line
  description: One row per order line, with its net amount after discount.
  model: ref('fct_order_line')
  defaults:
    agg_time_dimension: ordered_on
  primary_entity: fct_order_line
  entities:
  - name: dim_customer
    type: foreign
    expr: customer_id
  - name: dim_part
    type: foreign
    expr: part_id
  dimensions:
  - name: ordered_on
    type: time
    type_params:
      time_granularity: day
  - name: order_status
    type: categorical
  measures:
  - name: revenue
    agg: sum
    expr: net_amount
  - name: orders
    agg: count_distinct
    expr: order_id
  - name: average_order_value_part_1
    agg: sum
    expr: net_amount
  - name: average_order_value_part_2
    agg: count_distinct
    expr: order_id
  - name: open_order_lines
    agg: sum
    expr: case when (order_status = 'O') then 1 end
metrics:
- name: revenue
  label: Revenue
  description: Net amount of every order line.
  type: simple
  type_params:
    measure: revenue
  time_granularity: day
- name: orders
  label: Orders
  description: How many orders were placed.
  type: simple
  type_params:
    measure: orders
- name: average_order_value_part_1
  label: Average order value (average_order_value_part_1)
  type: simple
  type_params:
    measure: average_order_value_part_1
  config:
    meta:
      part_of: average_order_value
- name: average_order_value_part_2
  label: Average order value (average_order_value_part_2)
  type: simple
  type_params:
    measure: average_order_value_part_2
  config:
    meta:
      part_of: average_order_value
- name: average_order_value
  label: Average order value
  description: Revenue per order.
  type: derived
  type_params:
    expr: average_order_value_part_1 / average_order_value_part_2
    metrics:
    - name: average_order_value_part_1
    - name: average_order_value_part_2
- name: open_order_lines
  label: Open order lines
  description: Order lines still open.
  type: simple
  type_params:
    measure: open_order_lines
