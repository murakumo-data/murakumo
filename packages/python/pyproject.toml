[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "murakumo"
version = "1.3.0"
description = "Model-first data engineering: design the logical model, generate the platform."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = ["data-engineering", "data-modelling", "dbt", "lakehouse", "iceberg", "code-generation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "rich>=13.9",
    "sqlglot>=26",
    "typer>=0.15",
]

[project.optional-dependencies]
# Introspect DuckDB databases and read the schema of Parquet, CSV and JSON files.
duckdb = ["duckdb>=1.1"]
# Introspect PostgreSQL databases; `murakumo verify` and `build` on PostgreSQL.
postgres = ["psycopg[binary]>=3.2", "dbt-postgres>=1.9"]
# `murakumo verify` and `build` on the other warehouses: dbt's adapter and the warehouse's driver.
redshift = ["dbt-redshift>=1.9", "redshift-connector>=2.1"]
databricks = ["dbt-databricks>=1.9", "databricks-sql-connector>=3.0"]
bigquery = ["dbt-bigquery>=1.9", "google-cloud-bigquery>=3.20"]
fabric = ["dbt-fabric>=1.9", "pyodbc>=5.1"]
synapse = ["dbt-synapse>=1.8", "pyodbc>=5.1"]
# Run `murakumo verify`: build and test the generated dbt project on DuckDB.
verify = ["dbt-duckdb>=1.9"]
# Introspect Snowflake, and load raw tables for `murakumo verify --warehouse snowflake`.
snowflake = ["snowflake-connector-python>=3.12"]
# Fetch Kafka sources with `murakumo ingest` (the consumer streaming engine).
kafka = ["kafka-python>=2.0"]
# `murakumo ai`: suggestions from a language model, with your own key. Off until a project enables it.
ai = ["anthropic>=0.70"]
# `murakumo ingest` with `stack.extract: dlt`: dlt fetches the sources and loads the raw tables.
dlt = ["dlt[duckdb]>=1.4"]
# Run `murakumo canvas`: the visual editor and the API it reads and writes the model through.
canvas = ["fastapi>=0.115", "uvicorn>=0.32"]
# Run the pipeline as Polars jobs: `murakumo run --engine polars`.
polars = ["polars>=1.0", "duckdb>=1.1", "pyarrow>=15"]
# Run the pipeline as PySpark jobs: `murakumo run --engine pyspark`. jdk4py brings a Java runtime.
pyspark = ["pyspark>=3.5,<4; python_version < '3.13'", "jdk4py>=21,<22", "duckdb>=1.1", "polars>=1.0", "pyarrow>=15"]

[project.urls]
Homepage = "https://murakumo.ai"
Documentation = "https://murakumo.ai/docs/"
Repository = "https://github.com/murakumo-data/murakumo"
Changelog = "https://murakumo.ai/docs/changelog/"

[project.scripts]
murakumo = "murakumo.cli:app"

[dependency-groups]
dev = [
    "anthropic>=0.70",
    "dbt-duckdb>=1.9",
    "dbt-postgres>=1.9",
    "dbt-snowflake>=1.10",
    "dlt[duckdb]>=1.4",
    "duckdb>=1.1",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jsonschema>=4.20",  # validates the data contracts against the ODCS JSON Schema
    "pandas>=2.0",
    "polars>=1.0",
    "psycopg[binary]>=3.2",
    "pyarrow>=15",
    "pytest>=8.3",
    "ruff>=0.8",
    "sqlalchemy>=2.0",
    "uvicorn>=0.32",
]

[tool.hatch.build.targets.wheel]
packages = ["src/murakumo"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["src/murakumo", "tests", "hatch_build.py", "README.md"]

[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Terraform and shell written out in full: their lines are as long as they are.
"src/murakumo/generate/orchestration_cloud.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# Typer declares CLI arguments as defaults.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Starlette's test client warns about its own httpx dependency; nothing for us to change.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
