[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "murakumo"
version = "0.3.0"
description = "Model-first data engineering: design the logical model, generate the platform."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = ["data-engineering", "data-modelling", "dbt", "lakehouse", "iceberg", "code-generation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "rich>=13.9",
    "sqlglot>=26",
    "typer>=0.15",
]

[project.optional-dependencies]
# Introspect DuckDB databases and read the schema of Parquet, CSV and JSON files.
duckdb = ["duckdb>=1.1"]
# Introspect PostgreSQL databases.
postgres = ["psycopg[binary]>=3.2"]
# Run `murakumo verify`: build and test the generated dbt project on DuckDB.
verify = ["dbt-duckdb>=1.9"]
# Introspect Snowflake, and load raw tables for `murakumo verify --warehouse snowflake`.
snowflake = ["snowflake-connector-python>=3.12"]
# Run `murakumo canvas`: the visual editor and the API it reads and writes the model through.
canvas = ["fastapi>=0.115", "uvicorn>=0.32"]
# Run the pipeline as Polars jobs: `murakumo run --engine polars`.
polars = ["polars>=1.0", "duckdb>=1.1", "pyarrow>=15"]
# Run the pipeline as PySpark jobs: `murakumo run --engine pyspark`. jdk4py brings a Java runtime.
pyspark = ["pyspark>=3.5,<4; python_version < '3.13'", "jdk4py>=21,<22", "duckdb>=1.1", "polars>=1.0", "pyarrow>=15"]

[project.urls]
Homepage = "https://github.com/murakumo-data/murakumo"
Repository = "https://github.com/murakumo-data/murakumo"

[project.scripts]
murakumo = "murakumo.cli:app"

[dependency-groups]
dev = [
    "dbt-duckdb>=1.9",
    "dbt-snowflake>=1.10",
    "duckdb>=1.1",
    "fastapi>=0.115",
    "httpx>=0.27",
    "polars>=1.0",
    "psycopg[binary]>=3.2",
    "pyarrow>=15",
    "pytest>=8.3",
    "ruff>=0.8",
    "uvicorn>=0.32",
]

[tool.hatch.build.targets.wheel]
packages = ["src/murakumo"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["src/murakumo", "tests", "hatch_build.py", "README.md"]

[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Typer declares CLI arguments as defaults.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Starlette's test client warns about its own httpx dependency; nothing for us to change.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
