[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "murakumo"
version = "0.1.0.dev0"
description = "Model-first data engineering: design the logical model, generate the platform."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = ["data-engineering", "data-modelling", "dbt", "lakehouse", "iceberg", "code-generation"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "rich>=13.9",
    "typer>=0.15",
]

[project.urls]
Homepage = "https://github.com/murakumo-data/murakumo"
Repository = "https://github.com/murakumo-data/murakumo"

[project.scripts]
murakumo = "murakumo.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/murakumo"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Typer declares CLI arguments as defaults.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.pytest.ini_options]
testpaths = ["tests"]
