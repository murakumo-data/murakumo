# A small OpenAPI 3 document for the importer tests.
openapi: 3.0.3
info:
  title: Shop API
  version: 1.0.0
servers:
  - url: https://api.shop.example/v1
paths: {}
components:
  schemas:
    Status:
      type: string
      enum: [active, closed]
    Address:
      type: object
      properties:
        city: { type: string }
    Customer:
      type: object
      description: A customer account.
      required: [id, email]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string, description: Login email. }
        created_at: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/Status" }
        address: { $ref: "#/components/schemas/Address" }
        tags: { type: array, items: { type: string } }
    VipCustomer:
      allOf:
        - $ref: "#/components/schemas/Customer"
        - type: object
          required: [tier]
          properties:
            tier: { type: string, enum: [gold, platinum], example: gold }
