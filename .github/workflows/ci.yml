name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python engine and CLI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    services:
      # A throwaway database for the PostgreSQL introspection tests.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: shop
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MURAKUMO_TEST_POSTGRES_URL: postgresql://postgres:test@localhost:5432/shop
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest

  canvas:
    name: Canvas app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/canvas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/canvas/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  package:
    name: Package and clean install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/canvas/package-lock.json
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: npm ci && npm run build
        working-directory: apps/canvas
      - run: uv build
        working-directory: packages/python
        env:
          MURAKUMO_REQUIRE_CANVAS: "1"
      - run: tools/smoke_test.sh packages/python/dist/murakumo-*-py3-none-any.whl
      - name: The npm launcher runs the built wheel
        run: |
          wheel=$(ls "$PWD"/packages/python/dist/murakumo-*-py3-none-any.whl)
          cd "$(mktemp -d)"
          npm pack "$GITHUB_WORKSPACE/packages/npm"
          npm install -g --prefix ./npm-global ./murakumo-*.tgz
          export MURAKUMO_SPEC="murakumo[canvas,verify,duckdb] @ file://$wheel"
          ./npm-global/bin/murakumo --version
          ./npm-global/bin/murakumo init demo --yes
          cd demo && ../npm-global/bin/murakumo validate
