name: Website

# murakumo.ai: the landing page (website/home) and the documentation (docs/, through
# website/mkdocs.yml). Pull requests build it, so a broken link fails the check; a push to main
# publishes it to GitHub Pages.

on:
  push:
    branches: [main]
    paths: ["docs/**", "website/**", "CHANGELOG.md", ".github/workflows/site.yml"]
  pull_request:
    paths: ["docs/**", "website/**", "CHANGELOG.md", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: website/build.sh
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  install-script:
    # The script murakumo.sh serves (website/home/install.sh): lint it, then install with it on a
    # clean runner, as a new user would, and run the command it installed.
    name: Install script (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: shellcheck -s sh website/home/install.sh
      - name: Install with the script, as it is piped from murakumo.sh
        run: sh -s -- --extras postgres < website/home/install.sh
      - name: The installed command runs
        run: |
          bin="$(uv tool dir --bin 2>/dev/null || echo "$HOME/.local/bin")"
          "$bin/murakumo" --version
          "$bin/murakumo" init "$RUNNER_TEMP/demo" --yes
          "$bin/murakumo" validate "$RUNNER_TEMP/demo"

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: [build, install-script]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
